[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: opt-in tests against the real Kippy service"]

[tool.coverage.run]
source = ["custom_components/kippy"]

[tool.coverage.report]
show_missing = true
# Keep the existing CI gate until the coverage backlog is addressed.
fail_under = 91

[tool.ruff]
target-version = "py313"
line-length = 88
extend-include = ["script/hassfest", "script/ha-const", "script/test-scaffold"]
extend-exclude = ["dev-config", ".venv-dev", ".venv-baseline"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/kippy"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
