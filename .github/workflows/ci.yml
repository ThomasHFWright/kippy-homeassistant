name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      api_repository:
        description: Optional API repository (owner/repo) for combined development
        type: string
      api_ref:
        description: API commit SHA (required with api_repository)
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      API_REPOSITORY: ${{ inputs.api_repository || vars.KIPPY_API_REPOSITORY }}
      API_REF: ${{ inputs.api_ref || vars.KIPPY_API_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Check API source selection
        if: env.API_REPOSITORY != ''
        run: |
          if [[ ! "$API_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Set API_REF to the full reviewed commit SHA for combined development'
            exit 1
          fi
      - name: Checkout API source for combined development
        if: env.API_REPOSITORY != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.API_REPOSITORY }}
          ref: ${{ env.API_REF }}
          path: .api-source
          persist-credentials: false
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libffi-dev libssl-dev libjpeg-dev zlib1g-dev libturbojpeg0-dev
      - name: Set up development environment
        run: |
          if [[ -n "$API_REPOSITORY" ]]; then
            export KIPPY_API_PATH="$GITHUB_WORKSPACE/.api-source"
          fi
          ./script/setup
      - name: Check
        run: ./script/check
      - name: Test
        run: ./script/test --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
